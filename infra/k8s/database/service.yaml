# This gives the database one steady address inside the cluster, named
# "postgres". The backend connects using this name, never a pod's own
# changing IP address.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hospital
  labels:
    app: hospital-db
spec:
  type: ClusterIP
  selector:
    app: hospital-db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432

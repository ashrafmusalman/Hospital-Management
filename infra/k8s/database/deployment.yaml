# This starts the Postgres database. Only the backend (api) is allowed
# to talk to it — see networking/db-networkpolicy.yaml. The admin and
# user websites can never touch the database directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-db
  namespace: hospital
  labels:
    app: hospital-db

spec:
  replicas: 1   # Note: to run more than one database copy, we'd need a
                # StatefulSet instead of a Deployment

  selector:
    matchLabels:
      app: hospital-db

  strategy:
    type: Recreate   # The storage disk can only be used by one pod at a
                      # time, so the old pod must fully stop before a new
                      # one can start

  template:
    metadata:
      labels:
        app: hospital-db

    spec:
      serviceAccountName: hospital-db-sa
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: POSTGRES_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # Using a subfolder
                                                         # here avoids a
                                                         # permission problem
                                                         # with a hidden
                                                         # "lost+found" folder

          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: hospital-db-pvc

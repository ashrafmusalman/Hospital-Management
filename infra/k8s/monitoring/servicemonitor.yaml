# This tells Prometheus to check the "/metrics" page on the api and
# database pods every 30 seconds, so we can see their health numbers
# in Prometheus and Grafana.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hospital-api-monitor
  namespace: hospital
  labels:
    app: hospital-api
    release: monitoring
spec:
  selector:
    matchLabels:
      app: hospital-api
  namespaceSelector:
    matchNames:
      - hospital
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
# NOTE: this one needs a bit more setup before it works. Postgres doesn't
# have a "/metrics" page by itself — you'll need to add a postgres_exporter
# sidecar container to database/deployment.yaml, and give the "postgres"
# Service (database/service.yaml) a second port named "metrics" that points
# at it. Until then, this entry finds no matching pod and just sits idle.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hospital-db-monitor
  namespace: hospital
  labels:
    app: hospital-db
    release: monitoring
spec:
  selector:
    matchLabels:
      app: hospital-db
  namespaceSelector:
    matchNames:
      - hospital
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
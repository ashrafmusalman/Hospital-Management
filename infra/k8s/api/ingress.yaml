# This opens a door so people outside the cluster can reach the backend
# at api.hospital.local. CORS (letting the admin/user sites call the API)
# is handled by the Traefik Middleware in middleware.yaml, referenced below
# — this cluster runs k3s's built-in Traefik ingress controller, not nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hospital-api-ingress
  namespace: hospital
  labels:
    app.kubernetes.io/part-of: hospital
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: hospital-cors@kubernetescrd

spec:
  ingressClassName: traefik

  rules:
    - host: api.100-59-43-37.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hospital-api-svc
                port:
                  number: 8000

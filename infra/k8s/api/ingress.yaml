# This opens a door so people outside the cluster can reach the backend
# at api.hospital.local. It also adds special permission headers (CORS)
# so a browser is allowed to call the backend from the admin and user sites.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hospital-api-ingress
  namespace: hospital
  labels:
    app.kubernetes.io/part-of: hospital
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"   # set to "true" once TLS is configured

    # CORS is switched on here (not in a separate Traefik file anymore),
    # so the admin and user websites are allowed to call the API.
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"        # restrict in production
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Accept"

spec:
  ingressClassName: nginx

  rules:
    - host: api.hospital.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hospital-api-svc
                port:
                  number: 8000

# Replaces the old infra/k8s/config/secret.yaml, which stored the real
# DB password and session-signing key as base64 (encoding, not encryption)
# in Git — readable by anyone with repo access, forever, in history even
# after a fix. The Vault Secrets Operator now creates and refreshes the
# same "hospital-secrets" Secret directly from Vault's secret/data/hospital
# path, so those values never touch Git. Nothing in the api/database
# Deployments changes — they still read hospital-secrets via secretKeyRef.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hospital-secrets
  namespace: hospital
spec:
  vaultAuthRef: hospital-vault-auth
  mount: secret
  type: kv-v2
  path: hospital
  refreshAfter: 30s
  destination:
    name: hospital-secrets
    create: true

# Where the Vault Secrets Operator finds Vault. Same address used as
# vault_addr in infra/terraform/vault-config.
#
# Vault is in the private subnet — this only resolves from inside the VPC
# (i.e. from pods running on master/worker), which is where this CR is
# consumed, so the private IP is correct here.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault-connection
  namespace: hospital
spec:
  address: "http://<VAULT_PRIVATE_IP>:8200" # replace with `terraform output vault_private_ip` from infra/terraform/vault/server

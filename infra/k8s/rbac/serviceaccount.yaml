# Each app (api, admin, user, db) gets its own ID card (ServiceAccount)
# and is assigned it via serviceAccountName in its Deployment, instead of
# everyone sharing one default ID card. Only hospital-api-sa is allowed to
# log in to the Kubernetes API (see rolebinding.yaml for what it can read)
# — the other three never call the Kubernetes API, so their auto-login
# tokens stay switched off.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hospital-api-sa
  namespace: hospital
  labels:
    app: hospital-api
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hospital-admin-sa
  namespace: hospital
  labels:
    app: hospital-admin
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hospital-user-sa
  namespace: hospital
  labels:
    app: hospital-user
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hospital-db-sa
  namespace: hospital
  labels:
    app: hospital-db
automountServiceAccountToken: false
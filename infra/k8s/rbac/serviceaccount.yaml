# Each app (api, admin, user) gets its own ID card (ServiceAccount) and is
# assigned it via serviceAccountName in its Deployment, instead of everyone
# sharing one default ID card. None of them call the Kubernetes API — the
# api pod gets its DB credentials via envFrom/secretKeyRef, which the
# kubelet injects directly — so their auto-login tokens all stay switched
# off.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hospital-api-sa
  namespace: hospital
  labels:
    app: hospital-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hospital-admin-sa
  namespace: hospital
  labels:
    app: hospital-admin
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hospital-user-sa
  namespace: hospital
  labels:
    app: hospital-user
automountServiceAccountToken: false
# This opens a door so people outside the cluster can open the patient
# portal at hospital.local. It uses the plain main address because this
# is the public website everyone visits first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hospital-user-ingress
  namespace: hospital
  labels:
    app.kubernetes.io/part-of: hospital
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web

spec:
  ingressClassName: traefik

  rules:
    - host: hospital.100-59-43-37.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hospital-user-svc
                port:
                  number: 80

# This is the strictest safety rule of all.
# Only the backend (api) may connect to the database, and only on
# port 5432. The database never starts a connection to anything else,
# except DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-api-only
  namespace: hospital
  labels:
    app.kubernetes.io/part-of: hospital
spec:
  podSelector:
    matchLabels:
      app: hospital-db

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:   # Only the backend (api) can talk to the database —
              # admin and user are never allowed in
        - podSelector:
            matchLabels:
              app: hospital-api
      ports:
        - protocol: TCP
          port: 5432

  egress:
    - ports:   # Let DNS lookups through, and nothing else
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

  # Everything else is blocked by default: the DB never initiates outbound
  # connections, and nothing but the API pod can reach it — not even the
  # ingress controller.

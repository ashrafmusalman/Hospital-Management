# This is a safety rule (like a firewall) for the patient portal.
# It only lets traffic IN from the ingress (the front door), and it
# only lets the user pod talk OUT to the backend (api) and to DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-allow-ingress-only
  namespace: hospital
  labels:
    app.kubernetes.io/part-of: hospital
spec:
  podSelector:
    matchLabels:
      app: hospital-user

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system   # k3s's built-in Traefik lives here, not a separate ingress-nginx namespace
      ports:
        - protocol: TCP
          port: 80

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: hospital-api
      ports:
        - protocol: TCP
          port: 8000

    - ports:   # Let DNS lookups through, so the pod can find
               # 'hospital-api-svc' by name
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

  # Everything else is blocked by default: user can't reach the DB, admin,
  # or the internet, and nothing but the ingress controller can reach it.

# Plain Kubernetes Secret holding the DB password and session-signing key.
# Values here must match the real RDS instance's credentials
# (db_user/db_password/db_name in infra/terraform/app/main.tf).
# data values are base64-encoded (kubectl -o yaml also emits Secrets this
# way) — decode with: echo '<value>' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: hospital-secrets
  namespace: hospital
  labels:
    app.kubernetes.io/part-of: hospital
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXMxMjM=
  POSTGRES_DB: aG9zcGl0YWw=
  SECRET_KEY: Y2I3ZWU5YTJlNjUyMTVhMDliMmE0ZTRhYzllYTVkMTBhNjFmMmVkYTU2ZWY0ZWVkM2FjN2VlOTFlNTZjZmQwZA==

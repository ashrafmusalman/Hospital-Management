# This is a box of settings that are safe to see (nothing secret inside).
# The api, admin, and user apps all read from this box to learn things
# like the database name, database port, and the API's public address.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hospital-config
  namespace: hospital
  labels:
    app.kubernetes.io/part-of: hospital
data:
  NODE_ENV: "production"
  PORT: "8000"
  DB_HOST: "hospital-postgres-db.c0pkk0aiyvzm.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "hospital"
  API_BASE_URL: "http://api.100-59-43-37.nip.io"

# Installs HashiCorp's Vault Secrets Operator, which is what makes the
# VaultConnection/VaultAuth/VaultStaticSecret CRs under infra/k8s/vault
# actually do anything. Kept as its own Application (rather than folded
# into infra/k8s) since it's cluster infrastructure, not app config, and
# has its own release/version to track.
#
# Bootstrapping note: the CRs in infra/k8s/vault only become valid once
# this Application has synced once and installed their CRDs. On a brand
# new cluster, sync this one first — after that, ArgoCD's self-heal keeps
# both in sync on their own.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault-secrets-operator
    targetRevision: "0.10.0"
    helm:
      values: |
        defaultVaultConnection:
          enabled: false # each app defines its own VaultConnection instead
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

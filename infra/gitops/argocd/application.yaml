apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hospital
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ashrafmusalman/doctor-api.git
    targetRevision: main
    path: infra/k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: hospital
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
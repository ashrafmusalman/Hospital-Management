apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hospital-api-monitor
  namespace: hospital
  labels:
    app: hospital-api
    release: monitoring
spec:
  selector:
    matchLabels:
      app: hospital-api
  namespaceSelector:
    matchNames:
      - hospital
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hospital-db-monitor
  namespace: hospital
  labels:
    app: hospital-db
    release: monitoring
spec:
  selector:
    matchLabels:
      app: hospital-db
  namespaceSelector:
    matchNames:
      - hospital
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
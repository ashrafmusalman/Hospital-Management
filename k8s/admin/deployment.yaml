apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-admin
  namespace: hospital
  labels:
    app: hospital-admin
    tier: frontend
    app.kubernetes.io/part-of: hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospital-admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hospital-admin
        tier: frontend
    spec:
      serviceAccountName: hospital-admin-sa
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              ATTEMPTS=0
              until nc -z hospital-api-svc 8000; do
                echo "Waiting for API... attempt $ATTEMPTS"
                ATTEMPTS=$((ATTEMPTS+1))
                if [ $ATTEMPTS -ge 20 ]; then
                  echo "API not ready after 60s — giving up"
                  exit 1
                fi
                sleep 3
              done
              echo "API is ready"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: hospital-admin
          image: ashrafkhan0277/hospital-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          env:
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: API_BASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 6
            failureThreshold: 10
            successThreshold: 1
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}